<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Mobile + PWA viewport: viewport-fit=cover enables iOS safe-area insets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#2D3E50" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS / Safari standalone app behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Legal Associates" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <title>Legal Associates - Empowering Legal Minds Since Decades</title>
    <meta name="description" content="Leading law book and journal publisher based in Cuttack, Odisha. Browse legal books, journals, and educational resources for legal professionals." />

    <!-- Google Fonts (swap prevents invisible text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
